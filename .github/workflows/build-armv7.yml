name: Build ARMv7 Docker Image

on:
  push:
    branches: [ "main" ]  # 代码推送至 main 分支时触发
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (用于跨平台构建)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ARMv7 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm/v7  # 指定 ARMv7 架构
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lunatv:armv7
            ghcr.io/${{ github.repository_owner }}/lunatv:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
